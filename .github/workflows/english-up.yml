name: english-up

# 只在本项目相关文件变化时运行
on:
  push:
    branches: [main]
    paths:
      - 'english-up/**'
      - '.github/workflows/english-up.yml'
  pull_request:
    paths:
      - 'english-up/**'
      - '.github/workflows/english-up.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: english-up

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 语法检查
        run: python -m py_compile scripts/build_tracker.py

      - name: 冒烟测试：生成打卡表并校验结构
        run: |
          python scripts/build_tracker.py \
            --out /tmp/daily-tracker.xlsx \
            --start 2026-10-19 \
            --weeks 52 \
            --prep-days 4 \
            --app "不背单词" \
            --exam-name CET-6 \
            --daily-min 150
          python - <<'PY'
          import openpyxl
          wb = openpyxl.load_workbook('/tmp/daily-tracker.xlsx')
          expected = ['打卡表', '周汇总', '指标看板', '资源清单']
          assert wb.sheetnames == expected, wb.sheetnames
          ws = wb['打卡表']
          assert ws.max_row == 369, ws.max_row          # 365 天 + 预备期 + 表头
          assert ws.max_column == 14, ws.max_column
          assert wb['周汇总'].max_row == 54
          print('OK:', wb.sheetnames, ws.dimensions)
          PY

      - name: 校验 skill frontmatter
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path('SKILL.md').read_text(encoding='utf-8')
          m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
          assert m, 'SKILL.md 缺少 frontmatter'
          fm = m.group(1)
          for key in ('name:', 'description:', 'license:'):
              assert key in fm, f'frontmatter 缺少 {key}'
          print('OK: SKILL.md frontmatter')
          PY
